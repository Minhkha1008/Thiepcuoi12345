<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Responsive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav style="text-align: center;">
        <a onclick="ChangeWidth('100%')"  href="#"><i class="fa-solid fa-laptop fa-3x" style="color: rgb(255, 212, 59);"></i></a>
        <a onclick="ChangeWidth('800px')"  href="#" ><i class="fa-solid fa-tablet-screen-button fa-3x" style="color: rgb(255, 212, 59);"></i></i></a>
        <a onclick="ChangeWidth('600px')"  href="#"><i class="fa-solid fa-mobile-screen fa-3x" style="color: rgb(255, 212, 59);"></i></a>
    </nav>

    <div style="display: flex; justify-content: center;">
        <iframe id="myframe" style="width: 100%; height: 100vh;" src="index.html" frameborder="0"></iframe>
    </div>
</body>
</html>
<script>
    myframe = document.getElementById('myframe')
    function ChangeWidth(w){
        myframe.style.width = w;
    }
</script>
